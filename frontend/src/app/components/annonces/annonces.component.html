<app-nav></app-nav>
<mat-card>
    <mat-card-content>
        <div class="card-container">
            <mat-card class="card">
              <mat-card-content>
                <span class="Mission">2</span><br>
                <span>Mes annonces</span>

                </mat-card-content>
            </mat-card>
          </div>
          <!-- app.component.html -->
          <div class="card-grid">
            <div *ngFor="let annonce of annonces; index as i" (click)="toggleDescription(i)">
               <div class="card">
                 <h2>{{ annonce.titre }}</h2>
                 <p>{{ annonce.date }}</p>
                 <p>{{ annonce.detail.slice(0, 200) + (showDescription[i] ? '...' : '') }}</p>
                 <button>{{ showDescription[i] ? 'See less' : 'See more' }}</button>
               </div>
            </div>
           </div>

    </mat-card-content>
</mat-card>
