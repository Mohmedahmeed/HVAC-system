<h2 mat-dialog-title>{{ data.title }}</h2>

<div mat-dialog-content>
  <p>{{ data.message }}</p>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">{{ data.cancelText || 'Cancel' }}</button>
  <button
    mat-flat-button
    [class]="confirmButtonClass"
    (click)="confirm()">
    {{ data.confirmText || 'Confirm' }}
  </button>
</div>
