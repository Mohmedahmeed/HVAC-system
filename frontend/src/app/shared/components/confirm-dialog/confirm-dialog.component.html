<h2 mat-dialog-title>{{ data.title }}</h2>

<div mat-dialog-content>
  <p>{{ data.message }}</p>
  <mat-form-field *ngIf="data.showReasonInput" appearance="outline" class="ch-dialog-reason-field">
    <mat-label>{{ data.reasonLabel || 'Reason' }}</mat-label>
    <textarea matInput [(ngModel)]="reason" rows="3"></textarea>
  </mat-form-field>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">{{ data.cancelText || 'Cancel' }}</button>
  <button
    mat-flat-button
    [class]="confirmButtonClass"
    (click)="confirm()">
    {{ data.confirmText || 'Confirm' }}
  </button>
</div>
